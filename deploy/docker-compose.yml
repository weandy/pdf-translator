# 轻量模式：只起后端 app 和前端 web，本地不跑任何模型（docs/01-tech-stack.md §6）
# 启动：在仓库根目录执行  docker compose -f deploy/docker-compose.yml up -d --build
name: pdf-translator

services:
  app:
    build: ../backend
    env_file:
      - path: ../.env
        required: false
    environment:
      PDFTR_DATA_DIR: /data
    volumes:
      # 命名卷沿用镜像中 /data 的属主（非 root 用户），避免宿主机目录权限问题
      - pdftr-data:/data
    restart: unless-stopped
    # 部署新版本时等待进行中的任务完成（PDFTR_SHUTDOWN_GRACE_S，默认 180 秒）
    stop_grace_period: 200s

  web:
    build: ../frontend
    environment:
      # 仅在宿主机反代来源已核验后设置，不信任全部私网或任意地址。
      PDFTR_WEB_TRUSTED_PROXIES: ${PDFTR_WEB_TRUSTED_PROXIES:-127.0.0.1/32}
      PDFTR_ADMIN_PATH: ${PDFTR_ADMIN_PATH:-/weandy}
    ports:
      - "127.0.0.1:${PDFTR_PORT:-18765}:80"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pdftr-data:
